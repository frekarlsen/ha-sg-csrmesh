[project]
name = "ha-sg-csrmesh"
version = "0.7.0rc2"
description = "Local control of first-generation SG Smart (CSRmesh) devices from Home Assistant"
license = "LGPL-3.0-only"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# A plain timeout argument is fine for these helpers (they wrap wait_for).
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
